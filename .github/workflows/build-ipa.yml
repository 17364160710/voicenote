name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build VoiceNote.ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and package
        run: |
          set -o pipefail
          {
            echo "###### 1. xcodegen generate"
            xcodegen generate
            PBX=VoiceNote.xcodeproj/project.pbxproj
            if grep -q "objectVersion = 77;" "$PBX"; then
              echo "downgrade objectVersion 77 -> 56"
              sed -i "" "s/objectVersion = 77;/objectVersion = 56;/" "$PBX"
              sed -i "" "s/compatibilityVersion = \"Xcode 16.0\";/compatibilityVersion = \"Xcode 14.0\";/" "$PBX"
            fi
            grep -m1 objectVersion "$PBX"
            echo
            echo "###### 2. xcodebuild -list"
            xcodebuild -list -project VoiceNote.xcodeproj
            echo
            echo "###### 3. xcodebuild build"
            xcodebuild \
              -project VoiceNote.xcodeproj \
              -scheme VoiceNote \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
            echo
            echo "###### 4. package"
            APP_PATH="build/Build/Products/Release-iphoneos/VoiceNote.app"
            test -d "$APP_PATH"
            rm -rf Payload VoiceNote-unsigned.ipa
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -qry VoiceNote-unsigned.ipa Payload
            ls -lh VoiceNote-unsigned.ipa
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/VoiceNote.app/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "Payload/VoiceNote.app/Info.plist"
          } 2>&1 | tee build.log

      - name: Post log when failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "构建失败,以下为关键输出。"
            echo '```'
            grep -n -E "error:|Error:|error " build.log | head -40 || true
            echo '--- tail 80 ---'
            tail -n 80 build.log || true
            echo '```'
          } > body.md
          head -c 12000 body.md > body_cut.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@body_cut.md && echo "comment posted"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNote-unsigned-ipa
          path: VoiceNote-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (public download link)
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: 语音速记 最新构建
          body: |
            由 GitHub Actions 自动构建的**未签名** IPA，需在越狱设备上安装。

            安装方式：TrollStore / AppSync Unified + Filza / `ipainstaller`
          files: VoiceNote-unsigned.ipa
          prerelease: true
