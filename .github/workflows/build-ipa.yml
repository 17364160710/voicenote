name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build VoiceNote.ipa
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (code signing disabled)
        run: |
          set -o pipefail
          xcodebuild \
            -project VoiceNote.xcodeproj \
            -scheme VoiceNote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VoiceNote.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到编译产物: $APP_PATH"
            exit 1
          fi
          rm -rf Payload VoiceNote-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VoiceNote-unsigned.ipa Payload
          ls -lh VoiceNote-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/VoiceNote.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "Payload/VoiceNote.app/Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNote-unsigned-ipa
          path: VoiceNote-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (public download link)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: 语音速记 最新构建
          body: |
            由 GitHub Actions 自动构建的**未签名** IPA，需在越狱设备上安装。

            安装方式：TrollStore / AppSync Unified + Filza / `ipainstaller`
          files: VoiceNote-unsigned.ipa
          prerelease: true
